name: Release builds

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: roflow-windows-x86_64.exe
            binary: target/x86_64-pc-windows-msvc/release/roflow.exe

          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: roflow-linux-x86_64
            binary: target/x86_64-unknown-linux-gnu/release/roflow

          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            artifact: roflow-macos-x86_64
            binary: target/x86_64-apple-darwin/release/roflow

          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: roflow-macos-aarch64
            binary: target/aarch64-apple-darwin/release/roflow

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
