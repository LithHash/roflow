name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            artifact: roflow-windows-x86_64.exe
            binary: target/release/roflow.exe

          - name: linux-x86_64
            os: ubuntu-latest
            artifact: roflow-linux-x86_64
            binary: target/release/roflow

          - name: macos-x86_64
            os: macos-13
            artifact: roflow-macos-x86_64
            binary: target/release/roflow

          - name: macos-aarch64
            os: macos-latest
            artifact: roflow-macos-aarch64
            binary: target/release/roflow

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Rename binary
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
